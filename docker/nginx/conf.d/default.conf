limit_req_zone $binary_remote_addr zone=articles:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=views:10m rate=60r/m;

server {
    listen 80;
    server_name _;
    root /app/public;
    index index.php;
    autoindex off;

    client_max_body_size 128m;

    location ~ ^/articles/[0-9]+/views$ {
        limit_req zone=views burst=20 nodelay;
        limit_req_status 429;
        try_files $uri /index.php?$query_string;
    }

    location ~ ^/articles/[0-9]+$ {
        limit_req zone=articles burst=40 nodelay;
        limit_req_status 429;
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php$ {
        internal;
        include fastcgi_params;
        fastcgi_pass php-fpm:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}
